<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <!-- SDK do Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #f8fafc);
            --surface: var(--tg-theme-secondary-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #0f172a);
            --muted: #94a3b8;
            --primary: var(--tg-theme-button-color, #6366f1);
            --primary-text: var(--tg-theme-button-text-color, #ffffff);
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
            --blue: #3b82f6;
            --border: #e2e8f0;
            --radius: 16px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 4px 0;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Card */
        .flashcard {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px 20px;
            box-shadow: var(--shadow);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
            border: 1px solid rgba(226, 232, 240, 0.5);
            position: relative;
        }

        .flashcard:active {
            transform: scale(0.98);
        }

        .card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-label svg {
            width: 14px;
            height: 14px;
        }

        .card-text {
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
            line-height: 1.5;
            word-break: break-word;
        }

        .card-hint {
            position: absolute;
            bottom: 12px;
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.6;
        }

        .card-hint svg {
            width: 12px;
            height: 12px;
        }

        /* Buttons */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary { background: var(--primary); }
        .btn-green { background: var(--green); }
        .btn-red { background: var(--red); }
        .btn-amber { background: var(--amber); }
        .btn-blue { background: var(--blue); }
        .btn-gray { background: #94a3b8; }
        .btn-sm { padding: 6px 10px; font-size: 0.75rem; border-radius: 8px; }
        .btn-block { width: 100%; }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* Forms */
        .form-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(226, 232, 240, 0.5);
            margin-top: 16px;
        }

        .form-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-title svg {
            width: 18px;
            height: 18px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--muted);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            background: var(--bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Progress */
        .progress {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .progress-label {
            font-size: 0.75rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 8px;
        }

        /* Empty */
        .empty {
            text-align: center;
            padding: 32px 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .empty svg {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            opacity: 0.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">Flashcards</div>
            <div class="header-icon">
                <i data-lucide="layers"></i>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-label" id="progress-label"></div>
        <div class="progress">
            <div class="progress-fill" id="progress-bar" style="width: 0%;"></div>
        </div>

        <!-- Card View -->
        <div id="deck-view">
            <div class="flashcard" onclick="virarCard()">
                <div class="card-label" id="card-status">
                    <i data-lucide="help-circle"></i>
                    <span>Pergunta</span>
                </div>
                <div class="card-text" id="card-content">Carregando seus flashcards...</div>
                <div class="card-hint">
                    <i data-lucide="mouse-pointer-click"></i>
                    <span>Toque para virar</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div id="action-buttons" class="btn-group hidden">
                <button class="btn btn-red" onclick="responder(1)">
                    <i data-lucide="x"></i> Errei
                </button>
                <button class="btn btn-amber" onclick="responder(3)">
                    <i data-lucide="meh"></i> Bom
                </button>
                <button class="btn btn-green" onclick="responder(5)">
                    <i data-lucide="check"></i> Fácil
                </button>
            </div>

            <!-- Manage Buttons -->
            <div id="manage-buttons" class="btn-group hidden">
                <button class="btn btn-blue" onclick="prepararEdicao()">
                    <i data-lucide="pencil"></i> Editar
                </button>
                <button class="btn btn-gray" onclick="deletarCardAtual()">
                    <i data-lucide="trash-2"></i> Excluir
                </button>
            </div>
        </div>

        <!-- Create Button -->
        <div style="margin-top: 8px;">
            <button class="btn btn-primary btn-block" onclick="abrirModoCriacao()">
                <i data-lucide="plus"></i> Novo Flashcard
            </button>
        </div>

        <!-- Form View -->
        <div id="form-view" class="form-card hidden">
            <div class="form-title" id="form-title">
                <i data-lucide="plus-circle"></i>
                <span>Novo Flashcard</span>
            </div>
            <div class="form-group">
                <label>Pergunta</label>
                <input type="text" id="input-pergunta" placeholder="Digite a pergunta...">
            </div>
            <div class="form-group">
                <label>Resposta</label>
                <textarea id="input-resposta" placeholder="Digite a resposta..." rows="3"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn btn-green" onclick="salvarCard()">
                    <i data-lucide="check"></i> Salvar
                </button>
                <button class="btn btn-gray" onclick="cancelarFormulario()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : 12345678;

        let flashcards = [];
        let currentIndex = 0;
        let mostrandoResposta = false;
        let cardIdEmEdicao = null;

        // Inicializa ícones Lucide
        lucide.createIcons();

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toast');
            toast.textContent = mensagem;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function atualizarProgresso() {
            const total = flashcards.length;
            const atual = Math.min(currentIndex + 1, total);
            const pct = total > 0 ? Math.round((currentIndex / total) * 100) : 0;
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('progress-label').textContent = 
                total > 0 ? `${atual} de ${total} cards` : '';
        }

        async function carregarCardsDoFirebase() {
            try {
                const response = await fetch(`/api/flashcards/${userId}?deck=Geral`);
                const result = await response.json();

                if (result.status === "success" && result.cards && result.cards.length > 0) {
                    flashcards = result.cards;
                    currentIndex = 0;
                    exibirCardAtual();
                } else {
                    flashcards = [];
                    document.getElementById('card-status').innerHTML = 
                        '<i data-lucide="inbox"></i><span>Vazio</span>';
                    document.getElementById('card-content').innerText = "Nenhum flashcard encontrado.";
                    ocultarBotoesAcao();
                    lucide.createIcons();
                }
                atualizarProgresso();
            } catch (err) {
                console.error("Erro ao conectar com a API:", err);
                document.getElementById('card-status').innerHTML = 
                    '<i data-lucide="alert-circle"></i><span>Erro</span>';
                document.getElementById('card-content').innerText = "Falha ao carregar flashcards.";
                ocultarBotoesAcao();
                lucide.createIcons();
            }
        }

        function exibirCardAtual() {
            if (currentIndex >= flashcards.length) {
                document.getElementById('card-status').innerHTML = 
                    '<i data-lucide="party-popper"></i><span>Concluído</span>';
                document.getElementById('card-content').innerText = "🎉 Você revisou todos os cards!";
                ocultarBotoesAcao();
                lucide.createIcons();
                atualizarProgresso();
                return;
            }

            mostrandoResposta = false;
            document.getElementById('card-status').innerHTML = 
                '<i data-lucide="help-circle"></i><span>Pergunta</span>';
            document.getElementById('card-content').innerText = flashcards[currentIndex].pergunta;
            
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('manage-buttons').classList.remove('hidden');
            lucide.createIcons();
            atualizarProgresso();
        }

        function virarCard() {
            if (flashcards.length === 0 || currentIndex >= flashcards.length) return;

            mostrandoResposta = !mostrandoResposta;
            if (mostrandoResposta) {
                document.getElementById('card-status').innerHTML = 
                    '<i data-lucide="lightbulb"></i><span>Resposta</span>';
                document.getElementById('card-content').innerText = flashcards[currentIndex].resposta;
                document.getElementById('action-buttons').classList.remove('hidden');
            } else {
                document.getElementById('card-status').innerHTML = 
                    '<i data-lucide="help-circle"></i><span>Pergunta</span>';
                document.getElementById('card-content').innerText = flashcards[currentIndex].pergunta;
                document.getElementById('action-buttons').classList.add('hidden');
            }
            lucide.createIcons();
        }

        function ocultarBotoesAcao() {
            document.getElementById('action-buttons').classList.add('hidden');
            document.getElementById('manage-buttons').classList.add('hidden');
        }

        // --- SALVAR (CRIAR OU EDITAR) ---
        function abrirModoCriacao() {
            cardIdEmEdicao = null;
            document.getElementById('form-title').innerHTML = 
                '<i data-lucide="plus-circle"></i><span>Novo Flashcard</span>';
            document.getElementById('input-pergunta').value = '';
            document.getElementById('input-resposta').value = '';
            document.getElementById('deck-view').classList.add('hidden');
            document.getElementById('form-view').classList.remove('hidden');
            lucide.createIcons();
        }

        function prepararEdicao() {
            if (flashcards.length === 0 || currentIndex >= flashcards.length) return;

            const cardAtual = flashcards[currentIndex];
            cardIdEmEdicao = cardAtual.id;

            document.getElementById('form-title').innerHTML = 
                '<i data-lucide="pencil"></i><span>Editar Flashcard</span>';
            document.getElementById('input-pergunta').value = cardAtual.pergunta;
            document.getElementById('input-resposta').value = cardAtual.resposta;

            document.getElementById('deck-view').classList.add('hidden');
            document.getElementById('form-view').classList.remove('hidden');
            lucide.createIcons();
        }

        function cancelarFormulario() {
            document.getElementById('deck-view').classList.remove('hidden');
            document.getElementById('form-view').classList.add('hidden');
        }

        async function salvarCard() {
            const pergunta = document.getElementById('input-pergunta').value.trim();
            const resposta = document.getElementById('input-resposta').value.trim();

            if (!pergunta || !resposta) {
                mostrarToast("Preencha a pergunta e a resposta!");
                return;
            }

            const url = cardIdEmEdicao 
                ? `/api/flashcards/${userId}/${cardIdEmEdicao}` 
                : `/api/flashcards/${userId}`;
            
            const method = cardIdEmEdicao ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pergunta, resposta, deck: "Geral" })
                });

                const result = await response.json();

                if (result.status === "success") {
                    mostrarToast(cardIdEmEdicao ? "Card atualizado!" : "Card criado!");
                    cancelarFormulario();
                    carregarCardsDoFirebase();
                } else {
                    mostrarToast(result.message);
                }
            } catch (err) {
                console.error("Erro na requisição:", err);
            }
        }

        // --- EXCLUSÃO ---
        async function deletarCardAtual() {
            if (flashcards.length === 0 || currentIndex >= flashcards.length) return;
            
            const cardAtual = flashcards[currentIndex];
            if (!confirm("Excluir este flashcard?")) return;

            try {
                const response = await fetch(`/api/flashcards/${userId}/${cardAtual.id}?deck=Geral`, {
                    method: 'DELETE'
                });
                const result = await response.json();

                if (result.status === "success") {
                    mostrarToast("Card excluído!");
                    carregarCardsDoFirebase();
                } else {
                    mostrarToast(result.message);
                }
            } catch (err) {
                console.error("Erro ao excluir card:", err);
            }
        }

        // --- RESPOSTA DE REVISÃO ---
        async function responder(dificuldade) {
            const cardAtual = flashcards[currentIndex];
            currentIndex++;
            exibirCardAtual();

            if (cardAtual && cardAtual.id) {
                try {
                    await fetch(`/api/flashcards/${userId}/review`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            card_id: cardAtual.id,
                            dificuldade: dificuldade,
                            deck: "Geral"
                        })
                    });
                } catch (err) {
                    console.error("Erro ao enviar resposta:", err);
                }
            }
        }

        // Inicialização
        carregarCardsDoFirebase();
    </script>
</body>

</html>
