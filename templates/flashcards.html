<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repetição Espaçada - Flashcards</title>
    <!-- SDK do Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f6f9);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #0088cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card:active {
            transform: scale(0.98);
        }

        .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-bottom: 10px;
        }

        .text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-errei {
            background-color: #e74c3c;
        }

        .btn-bom {
            background-color: #f39c12;
        }

        .btn-facil {
            background-color: #2ecc71;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="deck-view">
            <div class="card" onclick="virarCard()">
                <div class="label" id="card-status">Pergunta</div>
                <div class="text" id="card-content">Carregando seus flashcards do Firebase...</div>
            </div>

            <div id="action-buttons" class="buttons hidden">
                <button class="btn btn-errei" onclick="responder(1)">Errei</button>
                <button class="btn btn-bom" onclick="responder(3)">Bom</button>
                <button class="btn btn-facil" onclick="responder(5)">Fácil</button>
            </div>
        </div>
        <!-- Botão para alternar a tela de criação -->
        <div style="margin-top: 15px;">
            <button class="btn" style="background-color: var(--button-color);" onclick="alternarModoCriacao()">
                ➕ Criar Novo Flashcard
            </button>
        </div>

        <!-- Formulário de Criação (oculto por padrão) -->
        <div id="create-view" class="hidden"
            style="margin-top: 20px; background: var(--card-bg); padding: 20px; border-radius: 16px;">
            <h3>Novo Flashcard</h3>
            <input type="text" id="input-pergunta" placeholder="Digite a Pergunta"
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;">
            <textarea id="input-resposta" placeholder="Digite a Resposta"
                style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;"></textarea>

            <div class="buttons">
                <button class="btn btn-facil" onclick="salvarNovoCard()">Salvar</button>
                <button class="btn btn-errei" onclick="alternarModoCriacao()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // Expande o WebApp para tela cheia no Telegram
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Obtém o Telegram User ID dinamicamente do contexto da conversa
        const tgUser = Telegram.WebApp.initDataUnsafe?.user;
        const userId = tgUser ? tgUser.id : 12345678; // ID de teste caso abra no navegador padrão

        let flashcards = [];
        let currentIndex = 0;
        let mostrandoResposta = false;

        // Busca os dados dinamicamente da API Flask / Firebase
        async function carregarCardsDoFirebase() {
            try {
                const response = await fetch(`/api/flashcards/${userId}?deck=Geral`);
                const result = await response.json();

                if (result.status === "success" && result.cards && result.cards.length > 0) {
                    flashcards = result.cards;
                    currentIndex = 0;
                    exibirCardAtual();
                } else {
                    document.getElementById('card-status').innerText = "Vazio";
                    document.getElementById('card-content').innerText = "Nenhum flashcard encontrado. Crie um pelo Telegram!";
                    document.getElementById('action-buttons').classList.add('hidden');
                }
            } catch (err) {
                console.error("Erro ao conectar com a API:", err);
                document.getElementById('card-status').innerText = "Erro";
                document.getElementById('card-content').innerText = "Falha ao carregar flashcards.";
            }
        }

        function exibirCardAtual() {
            if (currentIndex >= flashcards.length) {
                document.getElementById('card-status').innerText = "Parabéns!";
                document.getElementById('card-content').innerText = "🎉 Você revisou todos os cards de hoje!";
                document.getElementById('action-buttons').classList.add('hidden');
                return;
            }

            mostrandoResposta = false;
            document.getElementById('card-status').innerText = "Pergunta";
            document.getElementById('card-content').innerText = flashcards[currentIndex].pergunta;
            document.getElementById('action-buttons').classList.add('hidden');
        }

        function virarCard() {
            if (flashcards.length === 0 || currentIndex >= flashcards.length) return;

            mostrandoResposta = !mostrandoResposta;
            if (mostrandoResposta) {
                document.getElementById('card-status').innerText = "Resposta";
                document.getElementById('card-content').innerText = flashcards[currentIndex].resposta;
                document.getElementById('action-buttons').classList.remove('hidden');
            } else {
                document.getElementById('card-status').innerText = "Pergunta";
                document.getElementById('card-content').innerText = flashcards[currentIndex].pergunta;
                document.getElementById('action-buttons').classList.add('hidden');
            }
        }

        async function responder(dificuldade) {
            const cardAtual = flashcards[currentIndex];

            // Avança a interface localmente para resposta rápida
            currentIndex++;
            exibirCardAtual();

            // Envia o feedback da revisão em segundo plano (se o card tiver um ID registrado no Firebase)
            if (cardAtual && cardAtual.id) {
                try {
                    await fetch(`/api/flashcards/${userId}/review`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            card_id: cardAtual.id,
                            dificuldade: dificuldade,
                            deck: "Geral"
                        })
                    });
                } catch (err) {
                    console.error("Erro ao enviar resposta:", err);
                }
            }
        }

        // Inicializa a aplicação carregando os dados do backend
        function alternarModoCriacao() {
            const deckView = document.getElementById('deck-view');
            const createView = document.getElementById('create-view');

            deckView.classList.toggle('hidden');
            createView.classList.toggle('hidden');
        }

        async function salvarNovoCard() {
            const pergunta = document.getElementById('input-pergunta').value.trim();
            const resposta = document.getElementById('input-resposta').value.trim();

            if (!pergunta || !resposta) {
                alert("Por favor, preencha a pergunta e a resposta!");
                return;
            }

            try {
                const response = await fetch(`/api/flashcards/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pergunta: pergunta,
                        resposta: resposta,
                        deck: "Geral"
                    })
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Limpa os campos e recarrega os cards
                    document.getElementById('input-pergunta').value = '';
                    document.getElementById('input-resposta').value = '';
                    alternarModoCriacao();
                    carregarCardsDoFirebase();
                } else {
                    alert("Erro ao salvar: " + result.message);
                }
            } catch (err) {
                console.error("Erro na requisição:", err);
            }
        }
        
    </script>
</body>

</html>
